<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Playlistr, ecualizador animado</title>
  <style>
    .bar{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite alternate}
    .bar:nth-child(2){animation-delay:-.9s}.bar:nth-child(3){animation-delay:-.45s}.bar:nth-child(4){animation-delay:-1.15s}
    @keyframes pulse{0%{transform:scaleY(.42)}100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>
  <rect width="512" height="512" rx="128" fill="#c5ef79"/>
  <g fill="#14171a">
    <rect class="bar" x="112" y="176" width="48" height="160" rx="24"/>
    <rect class="bar" x="192" y="112" width="48" height="288" rx="24"/>
    <rect class="bar" x="272" y="80" width="48" height="352" rx="24"/>
    <rect class="bar" x="352" y="144" width="48" height="224" rx="24"/>
  </g>
</svg>
